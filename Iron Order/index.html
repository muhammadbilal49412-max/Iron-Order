<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/Neon Crimson Serpent Emblem.png"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Iron Order | Home page</title>

    <style>
      :root {
        --crimson: #b00020;
        --ivory: #e8dfc9;
        --steel: #777777;
        --gold: #a88945;
        --charcoal: #171717;
        --iron-red: #8b0000;
        --black: #0a0a0a;
        --white: #f5f5f5;
      }
      body {
        background-color: var(--black);
        color: crimson;
        text-shadow: -2px -1px 5px rgba(59, 91, 143, 1);
      }
      .grid {
        display: grid;
        background-color: var(--black);
        grid-template-columns: 1fr 1fr;
        gap: 0.5px;
        margin: 10px auto;
        width: 90%;
        margin-top: 35px;
        border: 1px solid rgba(168, 32, 32, 1);
        box-shadow: 23px 13px 20px rgba(168, 32, 32, 1);
      }
      .big {
        align-items: center;
        gap: 20px;
        aspect-ratio: 1/1;
        justify-content: center;
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease;
      }
      .big:hover {
        border: 2px solid rgba(168, 32, 32, 1);
        background: var(--charcoal);
        box-shadow: -10px 10px 0px rgba(168, 32, 32, 1);
        transform: translate(13px, -10px);
        text-shadow: -2px 1px 2px rgba(0, 122, 88, 1);
      }
      .intro,
      .welcome {
        display: flex;
        align-items: center;
        flex-direction: column;
        gap: 30px;
      }
      .welcome {
        display: none;
      }
      .small {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 2px;
      }
      .stats {
        display: none;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 2px;
      }
      .square {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        position: relative;
        transition: transform 0.3s ease;
      }
      .signup form {
        display: flex;
        padding-left: 120px;
        padding-top: 150px;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 100%;
        max-width: 360px;
      }
      .signup input {
        padding: 12px;
        background: #111111;
        color: rgba(168, 32, 32, 1);
        border-right: none;
        border-left: 1.5px solid rgba(168, 91, 22, 1);
        border-bottom: 1.5px solid rgba(168, 91, 22, 1);
        box-shadow: -5px 4px 4px rgba(168, 32, 32, 1);
        font-size: 16px;
        font-family: "Cinzel", serif;
        text-shadow: none;
        transition: transform 0.3s ease;
      }
      .signup,
      .stats {
        grid-column: 1 / -1;
        grid-row: 1 / -1;
      }
      .signup input:hover {
        border: 1px solid var(--crimson);
        background: #111111;
        box-shadow: -3px -3px 0px rgba(168, 32, 32, 1);
        transform: translate(12px, 10px);
        text-shadow: -2.5px -1px 1.5px rgba(0, 122, 88, 1);
      }
      .signup button {
        font-family: "Cinzel", serif;
        font-weight: bold;
        align-self: flex-end;
        padding: 12px;
        border-top: 0.5px solid #111111;
        border-right: none;
        border-bottom: 1.5px solid rgba(168, 91, 22, 1);
        border-left: 1.5px solid rgba(168, 91, 22, 1);
        font-size: 16px;
        width: 100px;
        box-sizing: border-box;
        background: #111111;
        color: rgba(168, 32, 32, 1);
        box-shadow: -4px 3px 2px rgba(168, 32, 32, 1);
        transition: transform 0.3s ease;
      }
      .signup button:hover {
        color: var(--gold);
        border: 1px solid var(--crimson);
        background: #111111;
        box-shadow: -3px -3px 0px rgba(168, 32, 32, 1);
        transform: translate(12px, 10px);
        text-shadow: -2.5px -1px 2px rgba(168, 91, 22, 1);
      }
      .square:hover {
        border: 2px solid rgba(168, 32, 32, 1);
        background: var(--charcoal);
        box-shadow: 10px 10px 0px rgba(168, 32, 32, 1);
        transform: translate(-12px, -12px);
        text-shadow: 2.5px 0.5px 1.5px rgba(0, 122, 88, 1);
      }
      .big h1 {
        font-size: clamp(28px, 4vw, 55px);
        font-family: "Cinzel", serif;
        white-space: nowrap;
        letter-spacing: 3px;
      }
      .big footer {
        font-family: "Times New Roman", Times, serif;
        text-shadow: none;
        text-align: center;
        font-size: 22px;
        color: var(--gold);
      }
      .big span {
        text-align: center;
        font-size: xx-large;
        font-family: "Times New Roman", Times, serif;
      }
      .square p {
        text-align: center;
        align-self: center;
        font-size: xx-large;
        color: var(--crimson);
      }
      .square p4 {
        text-align: center;
        align-self: center;
        font-size: xx-large;
      }
      .square p1 {
        text-align: center;
        align-self: center;
        font-size: xx-large;
      }
      .square p2 {
        text-align: center;
        align-self: center;
        font-size: xx-large;
      }
      .error {
        font-family: "Times New Roman", Times, serif;
        margin: 0;
        text-shadow: none;
        min-height: 1.2em;
        font-size: 20px;
        font-weight: bolder;
        color: var(--gold);
      }
      @media (max-width: 700px) {
        .grid {
          box-shadow: 5px 8px 30px var(--ivory);
          grid-template-columns: 1fr;
        }
        .small {
          color: var(--crimson);
          font-size: large;
        }
        .big {
          color: var(--crimson);
        }
        .big:hover {
          color: rgba(168, 91, 22, 1);
          border: 1.5px solid var(--steel);
          box-shadow: 0px 0px 30px var(--gold);
          transform: perspective(800px) translateZ(50px);
        }
        .square:hover {
          color: rgba(168, 91, 22, 1);
          border: 1.5px solid var(--steel);
          box-shadow: 0px 0px 30px var(--gold);
          transform: perspective(800px) translateZ(50px);
        }
        .signup {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        .signup form {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 0;
          width: 60%;
          max-width: 360px;
        }
        .signup input {
          width: 100%;
          box-sizing: border-box;
          padding: 10px;
          background: #111111;
          color: rgba(168, 32, 32, 1);
          border: 1.5px solid var(--gold);
          font-size: 16px;
          box-shadow: none;
          font-family: "Cinzel", serif;
          text-shadow: none;
          transition: transform 0.3s ease;
        }
        .signup input:hover {
          border: 1px solid var(--steel);
          background: #111111;
          box-shadow: 0px 0px 18px var(--gold);
          transform: perspective(800px) translateZ(60px);
          text-shadow: -2.5px 1px 1.5px rgba(0, 122, 88, 1);
        }
        .signup button {
          font-family: "Cinzel", serif;
          font-weight: bold;
          align-self: center;
          padding: 12px;
          border: 1.75px solid var(--gold);
          font-size: 16px;
          width: 100px;
          box-sizing: border-box;
          background: #111111;
          color: rgba(168, 32, 32, 1);
          box-shadow: none;
          transition: transform 0.3s ease;
        }
        .signup button:hover {
          color: var(--gold);
          border: 1px solid var(--steel);
          background: #111111;
          box-shadow: 0px 0px 15px var(--gold);
          transform: perspective(800px) translateZ(60px);
          text-shadow: -2.5px 1px 2px rgba(168, 91, 22, 1);
        }
      }
    </style>
  </head>
  <body>
    <div class="grid">
      <div class="big">
        <div class="intro">
          <h1>IRON ORDER</h1>
          <footer>
            Join The Order and Lend Us <br />
            Your Strength
          </footer>
        </div>
        <div class="welcome">
          <h1>WELCOME</h1>
          <span class="player-name"></span>
          <footer>Complete The Following Tasks to Help The Order</footer>
        </div>
      </div>
      <div class="small">
        <div class="signup">
          <form>
            <input type="text" placeholder="User-name" />
            <p class="error"></p>
            <button type="submit">JOIN</button>
          </form>
        </div>
        <div class="stats">
            <a href="https://iron-order-task1.netlify.app/" class="square" >
              <p>Task 1</p>
            </a>
          <div class="square">
            <p>
              coming <br />
              soon
            </p>
          </div>
          <div class="square">
            <p2
              >coming <br />
              soon</p2
            >
          </div>
          <div class="square">
            <p4
              >coming <br />
              soon</p4
            >
          </div>
        </div>
      </div>
    </div>
    <script>
      const signup = document.querySelector(".signup form");
      const stats = document.querySelector(".stats");
      const errorbox = document.querySelector(".error");
      const intro = document.querySelector(".intro");
      const welcome = document.querySelector(".welcome");
      const playername = document.querySelector(".player-name");
      const usernameinput = document.querySelector(
        ".signup input[type='text']"
      );

      function showWelcome(name) {
        playername.textContent = name;
        intro.style.display = "none";
        welcome.style.display = "flex";
        signup.style.display = "none";
        stats.style.display = "grid";
      }

      signup.addEventListener("submit", function (event) {
        event.preventDefault();
        const username = usernameinput.value.trim();
        if (username === "") {
          errorbox.textContent = "Please Enter a Username";
          return;
        }
        localStorage.setItem("username", username);
        showWelcome(username);
      });

      const save = localStorage.getItem("username");
      if (save) {
        showWelcome(save);
      }
    </script>
  </body>
</html>
