<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RPS</title>
    <!--Link to CSS-->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="head">
      <h1>Rock Paper Scissors</h1>
      <button id="yes">PLAY</button>
    </div>
    <!--Class of main display-->
    <div class="game">
      <div class="moves">
        <h1 class="had" id="you"></h1>
        <h1 id="move"></h1>
        <h1 class="hand" id="comp"></h1>
      </div>
      <!--Class of choice buttons-->
      <div class="play">
        <button id="ro">✊</button>
        <button id="pa">✋</button>
        <button id="sc">✌️</button>
      </div>
    </div>
    <!--HUD/Scoreboard-->
    <div class="hud">
      <h2 id="result"></h2>
      <h2>=====================</h2>
      <h2 id="score1"></h2>
      <h2 id="score2"></h2>
      <h2 id="round"></h2>
      <h2>=====================</h2>
      <button id="again">Play Again</button>
    </div>
    <!--Link to JS-->
    <script src="code4.js"></script>
  </body>
</html>
